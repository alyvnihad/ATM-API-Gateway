spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            -PreserveHostHeader
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
            - id: card-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/cards/**
            - id: account-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/accounts/**
            - id: atm-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/atm/**
            - id: transaction-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/transactions/**
            - id: notification-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/notifications/**
            - id: report-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/reports/**
server:
  port: 8080